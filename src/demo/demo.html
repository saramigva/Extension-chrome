<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo antes/después · Radar de webs</title>
    <link rel="stylesheet" href="report.css" />
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; background: var(--bg); }
      .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--border); }
      .bar h1 { font-size: 15px; margin: 0 12px 0 0; }
      .bar .spacer { flex: 1; }
      .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
      .stage { flex: 1; display: grid; gap: 12px; padding: 12px; min-height: 0; }
      .stage.both { grid-template-columns: 1fr 1fr; }
      .pane { display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--card); }
      .pane h2 { margin: 0; padding: 6px 10px; border-bottom: 1px solid var(--border); }
      .pane .body { flex: 1; overflow: auto; min-height: 0; }
      .pane img { width: 100%; display: block; }
      iframe { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
      .frame-wrap { height: 100%; display: flex; justify-content: center; }
      .frame-wrap.mobile iframe { width: 390px; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
      .missing { padding: 24px; }
      @media (max-width: 900px) { .stage.both { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body class="rw">
    <div class="bar">
      <h1 id="title">Demo</h1>
      <span class="row seg" id="views">
        <button data-v="both" aria-pressed="true">Antes / Después</button>
        <button data-v="before">Antes</button>
        <button data-v="after">Después</button>
      </span>
      <span class="row seg" id="device">
        <button data-d="desktop" aria-pressed="true">Ordenador</button>
        <button data-d="mobile">Móvil</button>
      </span>
      <span class="spacer"></span>
      <button id="download" class="primary">Descargar propuesta (HTML)</button>
    </div>
    <div class="stage both" id="stage">
      <section class="pane" id="before"><h2>Antes · web actual</h2><div class="body" id="before-body"></div></section>
      <section class="pane" id="after"><h2>Después · propuesta</h2><div class="body"><div class="frame-wrap" id="frame-wrap"><iframe id="frame" title="Propuesta" sandbox="allow-popups allow-popups-to-escape-sandbox"></iframe></div></div></section>
    </div>
    <script type="module" src="demo.js"></script>
  </body>
</html>
