<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Ajustes · Radar de webs</title>
    <link rel="stylesheet" href="report.css" />
    <style>
      body { max-width: 560px; margin: 0 auto; padding: 24px 16px; background: var(--bg); }
      form { display: flex; flex-direction: column; gap: 12px; }
      label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); }
      label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--fg); }
      fieldset { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
      legend { font-weight: 600; padding: 0 6px; }
    </style>
  </head>
  <body class="rw">
    <h1>Ajustes</h1>
    <form id="form">
      <fieldset>
        <legend>Tu firma (para los mensajes y la demo)</legend>
        <label>Nombre<input name="senderName" placeholder="Sara" /></label>
        <label>A qué te dedicas (opcional)<input name="senderRole" placeholder="diseñadora web" /></label>
        <label>Teléfono<input name="senderPhone" placeholder="+351 9xx xxx xxx" /></label>
        <label>Tu web o portfolio<input name="senderWeb" placeholder="https://…" /></label>
      </fieldset>
      <fieldset>
        <legend>Detección automática</legend>
        <label class="check"><input type="checkbox" name="autoPanel" /> Mostrar el aviso flotante al abrir webs mejorables</label>
        <label>Nota mínima para el aviso (0–100)<input type="number" name="threshold" min="0" max="100" /></label>
        <label class="check"><input type="checkbox" name="serpBadges" /> Mostrar la nota junto a los resultados de Google</label>
      </fieldset>
      <div class="row"><button class="primary" type="submit">Guardar</button><span id="status" class="muted"></span></div>
    </form>
    <p class="muted small">Todo se guarda en tu navegador. Radar de webs analiza las páginas en tu ordenador y no envía nada a ningún servidor.</p>
    <script type="module" src="options.js"></script>
  </body>
</html>
